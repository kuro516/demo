<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ジャグルノーツ</title>
  <style>
    body {
      margin: 0;
      background: #181824;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
      color: white;
    }
    canvas {
      touch-action: none;
      background: #1e1e2f;
      border: 4px solid #ff4081;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(255, 64, 129, 0.3);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    canvas.fever {
      border-color: #ffca28;
      box-shadow: 0 0 35px rgba(255, 202, 40, 0.8);
    }
    .controls {
      margin-top: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .diff-selector {
      display: flex;
      gap: 10px;
    }
    .diff-btn {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #555;
      background: #222;
      color: #ccc;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .diff-btn .best { display:block; font-size:10px; font-weight:normal; margin-top:2px; opacity:.85; letter-spacing:.3px; }
    .diff-btn.active {
      border-color: #ff4081;
      background: #ff4081;
      color: white;
      box-shadow: 0 0 10px rgba(255, 64, 129, 0.5);
    }
    .main-btn {
      padding: 12px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background: #00e676;
      color: #111;
      border-radius: 24px;
      box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
      transition: transform 0.1s;
    }
    .main-btn:hover { transform: scale(1.05); }
    #retryBtn {
      background: #ff4081;
      color: white;
      box-shadow: 0 4px 12px rgba(255, 64, 129, 0.4);
      display: none;
    }
    .offset-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #ccc; }
    .offset-row span.val { min-width: 64px; text-align: center; font-weight: bold; color: #fff; }
    .off-btn {
      width: 34px; height: 30px; font-size: 18px; font-weight: bold; line-height: 1;
      border: 2px solid #555; background: #222; color: #ccc; border-radius: 10px; cursor: pointer;
    }
    .offset-hint { font-size: 11px; color: #888; margin-top: -4px; }
    .instructions {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
    .key-guide {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: white;
    }
    .blue-key { background: #29b6f6; }
    .red-key { background: #ff5252; }
    #recOverlay { display:none; position:fixed; inset:0; background:rgba(10,7,26,.95); z-index:50; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #recBox { max-width:520px; margin:0 auto; padding:16px 16px 40px; color:#fff; font-family:sans-serif; }
    #recBox h2 { margin:6px 0 12px; font-size:20px; text-align:center; }
    .rec-tabs { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
    .rec-tab { padding:7px 14px; border-radius:16px; border:2px solid #555; background:#222; color:#ccc; font-weight:bold; font-size:13px; cursor:pointer; }
    .rec-tab.on { background:#ff4081; border-color:#ff4081; color:#fff; }
    .rec-card { background:#1c1740; border:2px solid #3d3580; border-radius:14px; padding:14px; margin-bottom:14px; }
    .rec-top { display:flex; align-items:center; gap:14px; }
    .rec-rank { font-size:64px; font-weight:900; font-style:italic; line-height:1; min-width:84px; text-align:center; }
    .rec-score { font-size:30px; font-weight:bold; }
    .rec-sub { font-size:12px; color:#a79dc0; margin-top:2px; }
    .rec-badge { display:inline-block; font-size:11px; font-weight:bold; padding:2px 8px; border-radius:10px; margin-left:6px; background:#ffca28; color:#3a2600; }
    .rec-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
    .rec-cell { background:#120f2e; border-radius:10px; padding:8px 6px; text-align:center; }
    .rec-cell b { display:block; font-size:18px; margin-top:2px; }
    .rec-cell span { font-size:10px; color:#a79dc0; }
    .rec-list { width:100%; border-collapse:collapse; font-size:13px; }
    .rec-list th { color:#a79dc0; font-weight:normal; font-size:11px; text-align:right; padding:4px 6px; }
    .rec-list td { padding:7px 6px; text-align:right; border-top:1px solid #2c2660; }
    .rec-list th:first-child, .rec-list td:first-child { text-align:left; }
    .rec-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
    .rec-actions button { padding:10px 18px; border-radius:20px; border:none; font-weight:bold; font-size:14px; cursor:pointer; color:#fff; background:#37326b; }
    .rec-actions button.pri { background:#ff4081; }

    /* ===== スマホ横持ち用レイアウト（body.mobile のときだけ有効。PCの見た目は変わらない） ===== */
    #stage { display: contents; }
    .fs-only, .fs-note { display: none; }
    body.mobile.fs-ok .fs-only { display: inline-block; }
    body.mobile.fs-ng .fs-note { display: block; width: 100%; text-align: center; font-size: 11px; color: #8d84a8; }
    body.mobile.m-result .fs-only, body.mobile.m-result .fs-note { display: none !important; }
    #tapGuide, #rotateMsg { display: none; }
    .m-title-text, .m-howto { display: none; }
    body.mobile {
      position: fixed; inset: 0; display: block; height: auto; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body.mobile #stage {
      display: flex; position: fixed; left: 0; top: 0; align-items: center; justify-content: center; box-sizing: border-box;
      padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
    }
    body.mobile h1, body.mobile .instructions { display: none; }
    body.mobile canvas { flex: none; }
    body.mobile .controls {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; z-index: 3;
      width: min(94%, 600px); max-height: calc(100% - 12px); overflow-y: auto; touch-action: pan-y; box-sizing: border-box;
      background: rgba(14, 10, 34, 0.92); border: 2px solid #3d3580; border-radius: 14px; padding: 8px 12px; gap: 6px;
      flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center;
    }
    body.mobile .controls > #diffGroup, body.mobile .controls > #offsetGroup, body.mobile .controls > .m-title-text, body.mobile .controls > .m-howto { width: 100%; justify-content: center; }
    body.mobile .m-title-text { display: block; text-align: center; font-weight: bold; font-size: 17px; }
    body.mobile .m-howto { display: block; text-align: center; font-size: 12px; color: #b8aecf; }
    body.mobile .diff-btn { padding: 5px 10px; font-size: 12px; }
    body.mobile .main-btn { font-size: 15px !important; padding: 8px 20px !important; }
    body.mobile.m-play .controls { display: none; }
    body.mobile.m-result .controls {
      top: auto; bottom: calc(max(6px, env(safe-area-inset-bottom)) + 4px); transform: translateX(-50%);
      width: auto; max-height: none; overflow: visible; background: none; border: none; padding: 0; gap: 10px; flex-wrap: nowrap;
    }
    body.mobile.m-result .m-title-text, body.mobile.m-result .m-howto { display: none; }
    body.mobile.m-result .main-btn { font-size: 13px !important; padding: 6px 14px !important; }
    /* タップ範囲のうすいガイド（プレイ中だけ） */
    body.mobile.m-play #tapGuide { display: block; position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #tapGuide .tg { position: absolute; top: 0; bottom: 0; width: 50%; }
    #tapGuide .tg.l { left: 0; background: linear-gradient(90deg, rgba(41,182,246,.09), rgba(41,182,246,0) 45%); }
    #tapGuide .tg.r { right: 0; background: linear-gradient(270deg, rgba(255,82,82,.09), rgba(255,82,82,0) 45%); }
    #tapGuide .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.07); }
    #tapGuide .lbl { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); font-size: 12px; font-weight: bold; letter-spacing: 1px; opacity: .5; }
    #tapGuide .tg.l .lbl { left: max(14px, env(safe-area-inset-left)); color: #81d4fa; }
    #tapGuide .tg.r .lbl { right: max(14px, env(safe-area-inset-right)); color: #ff8a80; }
    .ripple { position: fixed; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none; z-index: 6; border: 3px solid; animation: rip .35s ease-out forwards; }
    @keyframes rip { from { transform: scale(.4); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
    #recOverlay { touch-action: pan-y; }
    /* 縦持ちのときの案内 */
    #rotateMsg { position: fixed; inset: 0; z-index: 100; background: #181824; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-size: 18px; font-weight: bold; color: #fff; text-align: center; padding: 20px; }
    #rotateMsg .ph { font-size: 64px; animation: rotph 2.2s ease-in-out infinite; }
    @keyframes rotph { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
</head>
<body>

  <div id="stage">
  <h1>ジャグルノーツ 🌟 DX</h1>
  
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  
  <div class="controls">
    <div class="m-title-text">ジャグルノーツ 🌟 DX</div>
    <div class="m-howto">🔵 画面の<b>左側</b>をタップ＝左手　🔴 画面の<b>右側</b>をタップ＝右手（どこでもOK）</div>
    <button id="fsBtn" class="off-btn fs-only" style="width:auto;padding:6px 14px" onclick="toggleFullscreen()">⛶ 全画面にする</button>
    <div class="fs-note">iPhoneは「共有」→「ホーム画面に追加」から開くと全画面で遊べます</div>
    <!-- 難易度選択 -->
    <div class="diff-selector" id="diffGroup">
      <button class="diff-btn active" onclick="setDifficulty('easy')">🌱 かんたん<small class="best" id="best-easy"></small></button>
      <button class="diff-btn" onclick="setDifficulty('normal')">🎵 ふつう<small class="best" id="best-normal"></small></button>
      <button class="diff-btn" onclick="setDifficulty('hard')">🔥 むずかしい<small class="best" id="best-hard"></small></button>
    </div>

    <!-- タイミング調整 -->
    <div id="offsetGroup" style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div class="offset-row">
        タイミング調整
        <button class="off-btn" onclick="adjustOffset(-5)">−</button>
        <span class="val" id="offsetVal">0 ms</span>
        <button class="off-btn" onclick="adjustOffset(5)">＋</button>
      </div>
      <button class="off-btn" id="calBtn" style="width:auto;padding:6px 14px" onclick="startCalibration()">🎯 タップで自動計測</button>
      <div class="offset-hint" id="calHint">ボールが音より先に着く感じなら「＋」、遅い感じなら「−」</div>
    </div>

    <!-- ボタン -->
    <button id="recBtn" class="main-btn" style="background:#37326b; font-size:15px; padding:9px 24px;" onclick="openRecords()">📊 記録を見る</button>
    <button id="startBtn" class="main-btn" onclick="startAudioGame()">🎵 音楽をかけてスタート！</button>
    <button id="retryBtn" class="main-btn" onclick="resetToTitle()">🔄 もう一度あそぶ（難易度選択）</button>
  </div>

  <div class="instructions">
    <p>🔵 <b>左手:</b> <span class="key-guide blue-key">A</span> キー / 上半分割 🔴 <b>右手:</b> <span class="key-guide red-key">L</span> または <span class="key-guide red-key">J</span> キー / 下半分割</p>
    <p>🔥 <b>10コンボ到達でFEVERモード突入！</b> スコア倍率がアップ＆豪華背景演出！</p>
  </div>
  </div><!-- /stage -->

  <div id="tapGuide"><div class="tg l"><span class="lbl">◀ 左手 TAP</span></div><div class="tg r"><span class="lbl">TAP 右手 ▶</span></div><div class="mid"></div></div>
  <div id="rotateMsg"><div class="ph">📱</div><div>スマホを横向きにしてください</div></div>

  <!-- BGM要素 -->
  <audio id="bgm" src="music.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const bgm = document.getElementById("bgm");

    // --- Web Audio API（効果音）---
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSE(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      if (type === "perfect") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === "good") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === "fever") {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.2, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.15);
        });
      } else if (type === "miss") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // ★ ハイスコア・ベストランクの保存（難易度ごと / このブラウザ内）
    const RANK_ORDER = ["C", "B", "A", "S", "SS"];
    let bestData = {};
    try { bestData = JSON.parse(localStorage.getItem("popcatch-best") || "{}") || {}; } catch (e) { bestData = {}; }
    function saveBest() { try { localStorage.setItem("popcatch-best", JSON.stringify(bestData)); } catch (e) {} }
    let history = [];
    try { history = JSON.parse(localStorage.getItem("popcatch-history") || "[]") || []; } catch (e) { history = []; }
    function saveHistory() { try { localStorage.setItem("popcatch-history", JSON.stringify(history.slice(-200))); } catch (e) {} }
    function renderBest() {
      ["easy", "normal", "hard"].forEach((d) => {
        const el = document.getElementById("best-" + d), b = bestData[d];
        if (!el) return;
        el.textContent = b ? `BEST ${b.score.toLocaleString()}  ${b.rank}${b.ap ? " ★AP" : b.fc ? " ★FC" : ""}` : "未プレイ";
      });
    }

    // --- ゲーム状態 ---
    let difficulty = "easy"; 
    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let isFever = false;
    
    let feedback = "";
    let feedbackColor = "#000";
    let feedbackTimer = 0;

    let shakeTimer = 0;
    let particles = [];

    const hitZoneX = 140; 
    
    const lanes = {
      left:  { name: "左手", y: 180, isCatching: false, catchTimer: 0, color: "#29b6f6" }, 
      right: { name: "右手", y: 300, isCatching: false, catchTimer: 0, color: "#ff5252" }  
    };

    const tosserX = 520;
    const tosserY_Left = 180;
    const tosserY_Right = 300;

    let balls = [];

    // ★ 譜面: 音源(music.mp3)を解析して作成。[手が着く時刻(ms), 手(0=左/A,1=右/L), 軌道(0=ふつう,1=低,2=高,3=超高)]

      if (lv <= 0) return;
      ctx.save();
      // 暗転（青みがかった夜）
      ctx.fillStyle = `rgba(6,10,38,${0.62 * lv})`;
      ctx.fillRect(-10, -10, W + 20, H + 20);
      // ゆっくり流れる星
      for (let i = 0; i < 46; i++) {
        const x = ((i * 97.3 + 40 - t * (6 + (i % 5) * 3)) % (W + 20) + (W + 20)) % (W + 20) - 10;
        const y = (i * 53.7 + 11) % H;
        const a = (0.25 + 0.3 * Math.sin(t * 1.4 + i * 1.7)) * lv;
        ctx.fillStyle = `rgba(190,215,255,${Math.max(0, a)})`;
        ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3) * 0.6, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
    function checkDrop(t) {
      if (!dropFired && t >= BREAK_END && t < BREAK_END + 2) {
        dropFired = true; dropStart = t;
        playSE("fever");
      }
    }
    function drawBreakdownFront(t) { /* 演出なし */ }
    // ★ 準備時間: 曲の頭からこの秒数まではボールが手元に着かない（最初のボールは PREP_TIME - 飛行時間 の頃に出現）
    const PREP_TIME = 5.0;
    let curArriveT = 0;         // いま生成中のボールが手元に着く曲内時刻

    // ★ タイミング調整(ms): 「＋」でボールの到着が遅くなる。端末ごとの音の遅れ(Bluetooth等)の補正用
    let offsetMs = 0;
    try { offsetMs = parseInt(localStorage.getItem("popcatch-offset") || "0", 10) || 0; } catch (e) {}
    function adjustOffset(d) {
      offsetMs = Math.max(-300, Math.min(300, offsetMs + d));
      document.getElementById("offsetVal").textContent = (offsetMs > 0 ? "+" : "") + offsetMs + " ms";
      try { localStorage.setItem("popcatch-offset", String(offsetMs)); } catch (e) {}
    }
    adjustOffset(0);

    // ★ タップ計測: クリック音に合わせて8回タップ → ズレの中央値をタイミング調整に反映
    let calActive = false;
    function startCalibration() {
      if (calActive) return;
      const hint = document.getElementById("calHint"), btn = document.getElementById("calBtn");
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { hint.textContent = "この環境では自動計測を使えません"; return; }
      const ctx = new AC(); ctx.resume();
      const N = 10, GAP = 0.6, t0 = ctx.currentTime + 1.2;
      const times = [];
      for (let i = 0; i < N; i++) {
        const t = t0 + i * GAP; times.push(t);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = i === 0 ? 660 : 1000; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.002);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06); o.start(t); o.stop(t + 0.08);
      }
      const taps = [];
      calActive = true; btn.disabled = true;
      hint.textContent = "クリック音に合わせて画面タップ / キーを押してください（最初の2回は練習）";
      const onTap = (e) => {
        if (e.type === "keydown" && e.repeat) return;
        e.preventDefault(); e.stopPropagation();
        const now = ctx.currentTime;
        // 一番近いクリックとの差(ms)
        let best = null;
        for (const t of times) { const d = (now - t) * 1000; if (best === null || Math.abs(d) < Math.abs(best)) best = d; }
        if (Math.abs(best) < 250) taps.push(best);
      };
      window.addEventListener("pointerdown", onTap, true);
      window.addEventListener("keydown", onTap, true);
      setTimeout(() => {
        window.removeEventListener("pointerdown", onTap, true);
        window.removeEventListener("keydown", onTap, true);
        calActive = false; btn.disabled = false; ctx.close();
        const use = taps.slice(2).sort((a, b) => a - b);
        if (use.length < 4) { hint.textContent = "タップが少なすぎました。もう一度どうぞ"; return; }
        const med = use[Math.floor(use.length / 2)];
        const v = Math.max(-300, Math.min(300, Math.round(med / 5) * 5));
        offsetMs = 0; adjustOffset(v);
        hint.textContent = "計測完了: " + (v > 0 ? "+" : "") + v + " ms を設定しました（微調整は＋／−で）";
      }, (t0 - ctx.currentTime + N * GAP + 0.5) * 1000);
    }

    // ★ ゲーム内時計: 音声の再生位置に同期（currentTimeの更新が粗い環境でも補間する）
    let lastCT = -1, lastCTperf = 0;
    function getGameTime() {
      const ct = bgm.currentTime;
      if (bgm.paused || bgm.ended) return ct - offsetMs / 1000;
      const now = performance.now();
      if (ct !== lastCT) { lastCT = ct; lastCTperf = now; }
      return lastCT + (now - lastCTperf) / 1000 - offsetMs / 1000;
    }
    // ★ ボール位置は「時刻」から計算する（フレームレートに依存しない）
    function ballPos(ball, t) {
      const u = (t - ball.spawnT) / travelTime;
      const f = u * ball.F;
      return {
        x: tosserX + (hitZoneX - tosserX) * u,
        y: ball.startY + ball.vy0 * f + 0.5 * ball.gravity * f * f
      };
    }

    function setDifficulty(diff) {
      if (isPlaying) return;
      difficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    window.addEventListener("keydown", (e) => {
      if (!isPlaying) return;
      const key = e.key.toLowerCase();
      if (key === "a") {
        catchBall("left");
      } else if (key === "l" || key === "j") {
        catchBall("right");
      }
    });

    canvas.addEventListener("pointerdown", (e) => {
      if (document.body.classList.contains("mobile")) return;   // スマホは画面の左右で判定（下の window ハンドラ）
      e.preventDefault();
      if (!isPlaying) return;
      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      
      if (clickY < canvas.height / 2) {
        catchBall("left");
      } else {
        catchBall("right");
      }
    });

    function catchBall(laneKey) {
      const lane = lanes[laneKey];
      lane.isCatching = true;
      lane.catchTimer = 8;

      let caught = false;
      const tNow = getGameTime();   // 入力した瞬間の時刻で判定

      balls.forEach((ball) => {
        if (!ball.caught && ball.laneKey === laneKey) {
          const diffX = Math.abs(ballPos(ball, tNow).x - hitZoneX);

          if (diffX < 45) {
            ball.caught = true;
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            if (combo === 10) {
              isFever = true;
              canvas.classList.add("fever");
              playSE("fever");
              showFeedback("🔥 FEVER START!! 🔥", "#ffca28");
            }

            const multiplier = isFever ? 2 : 1;
            const comboBonus = Math.min(combo * 10, 300);
            
            if (diffX < 18) {
              score += (100 + comboBonus) * multiplier;
              showFeedback("PERFECT!!", "#ff007f"); perfectCount++;
              playSE("perfect");
              shakeTimer = 5;
              createParticles(hitZoneX, lane.y, "#ff007f", 12);
            } else {
              score += (50 + comboBonus) * multiplier;
              showFeedback("GOOD!", "#00e676"); goodCount++;
              playSE("good");
              createParticles(hitZoneX, lane.y, "#00e676", 6);
            }
            caught = true;
          }
        }
      });

      if (!caught) {
        const nearBall = balls.some(b => !b.caught && b.laneKey === laneKey && Math.abs(ballPos(b, tNow).x - hitZoneX) < 60);
        if (nearBall) {
          resetCombo();
        }
      }
    }

    function resetCombo() {
      combo = 0;
      if (isFever) {
        isFever = false;
        canvas.classList.remove("fever");
      }
      playSE("miss");
      missCount++;
      showFeedback("MISS!", "#aaa");
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 5 + 3,
          color: color,
          life: 20
        });
      }
    }

    function showFeedback(text, color) {
      feedback = text;
      feedbackColor = color;
      feedbackTimer = 25;
    }

    // 🎯 速度は一定（travelBeats固定）のまま、軌道(arcType)のアーチの高さで変化をつける
    function spawnBeatBall(laneKey, travelBeats = TRAVEL_BEATS, arcType = "normal") {
      // travelBeats 引数は互換のため残してあるが、飛行時間は TRAVEL_BEATS(2拍)に固定
      const lane = lanes[laneKey];
      const color = lane.color; 
      const framesToReach = travelTime * 60;   // 軌道計算用の基準フレーム数（見た目の形は従来どおり）

      const targetY = lane.y;
      const startY = (laneKey === "left") ? tosserY_Left : tosserY_Right;

      // 軌道に応じた重力（アーチの高さ）の制御
      let gravity = 14 / framesToReach; // normal
      if (arcType === "superHigh") gravity = 32 / framesToReach; // 超高軌道
      if (arcType === "high")      gravity = 22 / framesToReach; // 高軌道
      if (arcType === "low")       gravity = 6 / framesToReach;  // 低軌道（ほぼ直線）

      const F = framesToReach;
      const vy0 = (targetY - startY - 0.5 * gravity * F * F) / F;

      balls.push({
        x: tosserX,
        y: startY,
        startY: startY,
        vy0: vy0,
        F: F,
        gravity: gravity,
        spawnT: curArriveT - travelTime,   // 手元に着く時刻が拍にそろうよう逆算
        arriveT: curArriveT,
        laneKey: laneKey,
        color: color,
        caught: false,
        passed: false
      });
    }

    function startAudioGame() {
      initAudioContext();
      document.getElementById("diffGroup").style.display = "none";
      document.getElementById("offsetGroup").style.display = "none";
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("retryBtn").style.display = "none";
      document.getElementById("recBtn").style.display = "none";
      document.body.classList.remove("m-title", "m-result"); document.body.classList.add("m-play");
      try { if (screen.orientation && screen.orientation.lock && document.body.classList.contains("mobile")) screen.orientation.lock("landscape").catch(() => {}); } catch (e) {}
      
      bgm.currentTime = 0;
      bgm.play().then(() => {
        isPlaying = true;
        score = 0;
        combo = 0;
        maxCombo = 0;
        perfectCount = goodCount = missCount = 0;
        isFever = false;
        dropFired = false; dropStart = -99;
        balls = [];
        particles = [];
        // 難易度の譜面を読み込み。曲頭すぎて飛行時間が足りないボールは出さない
        chartNotes = CHARTS[difficulty].filter(n => n[0] / 1000 >= PREP_TIME);
        nextNoteIdx = 0;
        lastCT = -1;
        requestAnimationFrame(gameLoop);
      }).catch(err => {
        alert("音楽ファイルの読み込みに失敗しました。`music.mp3` の配置を確認してください。");
        resetToTitle();
      });
    }

    function resetToTitle() {
      isPlaying = false;
      score = 0;
      combo = 0;
      maxCombo = 0;
      perfectCount = goodCount = missCount = 0;
      finishActive = false;
      cancelAnimationFrame(finishRaf);
      fx = [];
      isFever = false;
      canvas.classList.remove("fever");
      balls = [];
      particles = [];

      document.getElementById("diffGroup").style.display = "flex";
      document.getElementById("offsetGroup").style.display = "flex";
      document.getElementById("startBtn").style.display = "inline-block";
      document.getElementById("retryBtn").style.display = "none";
      document.getElementById("recBtn").style.display = "inline-block";
      syncMode();

      drawTitleScreen();
    }

    function drawTitleScreen() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(hitZoneX, 0);
      ctx.lineTo(hitZoneX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#33334e";
      ctx.fillRect(tosserX - 15, tosserY_Left - 20, 30, 40);
      ctx.fillRect(tosserX - 15, tosserY_Right - 20, 30, 40);

      Object.keys(lanes).forEach((key) => {
        const lane = lanes[key];
        ctx.save();
        ctx.translate(hitZoneX, lane.y);
        ctx.fillStyle = lane.color;
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(lane.name, 0, 0);
        ctx.restore();
      });
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
        shakeTimer--;
      }

      ctx.clearRect(-10, -10, canvas.width + 20, canvas.height + 20);


      // フィーバー中: 画面全体は染めず、黄色いキラキラ粒だけを散らす
      if (isFever && Math.random() < 0.4) {
        createParticles(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() < 0.5 ? "#ffca28" : "#fff59d", 1);
      }

      const currentTime = getGameTime();
      drawBreakdownBack(currentTime);
      checkDrop(currentTime);
      // 「手元に着く時刻」の travelTime(飛行時間) 前になったボールを、譜面から生成する
      while (nextNoteIdx < chartNotes.length && chartNotes[nextNoteIdx][0] / 1000 - travelTime <= currentTime) {
        const n = chartNotes[nextNoteIdx++];
        curArriveT = n[0] / 1000;
        spawnBeatBall(n[1] === 0 ? "left" : "right", TRAVEL_BEATS, ARC_NAMES[n[2]]);
      }

      // ボール移動＆描画
      balls.forEach((ball) => {
        if (!ball.caught) {
          const pos = ballPos(ball, currentTime);
          ball.x = pos.x;
          ball.y = pos.y;

          if (!ball.passed && ball.x < hitZoneX - 40) {
            ball.passed = true;
            resetCombo();
          }

          ctx.beginPath();
          ctx.arc(ball.x, ball.y, 18, 0, Math.PI * 2);
          ctx.fillStyle = ball.color;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
          
          ctx.beginPath();
          ctx.arc(ball.x - 5, ball.y - 5, 5, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.fill();
        }
      });

      balls = balls.filter(b => !b.caught && b.x > -50);

      // パーティクル移動＆描画
      particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / 20), 0, Math.PI * 2);
        ctx.fill();
      });
      particles = particles.filter(p => p.life > 0);

      // --- レーン・手・背景描画 ---
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      ctx.strokeStyle = isFever ? "rgba(255, 202, 40, 0.8)" : "rgba(255, 255, 255, 0.3)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(hitZoneX, 0);
      ctx.lineTo(hitZoneX, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#33334e";
      ctx.fillRect(tosserX - 15, tosserY_Left - 20, 30, 40);
      ctx.fillRect(tosserX - 15, tosserY_Right - 20, 30, 40);

      // 🖐️ 手
      Object.keys(lanes).forEach((key) => {
        const lane = lanes[key];
        ctx.save();
        ctx.translate(hitZoneX, lane.y);

        if (lane.isCatching) {
          ctx.scale(0.82, 0.82);
          lane.catchTimer--;
          if (lane.catchTimer <= 0) lane.isCatching = false;
        }

        ctx.fillStyle = lane.color;
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(lane.name, 0, 0);

        ctx.restore();
      });

      // --- UI描画 ---
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 22px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`SCORE: ${score}`, 20, 40);

      if (combo > 1) {
        ctx.save();
        ctx.fillStyle = isFever ? "#ffea00" : "#ffca28";
        ctx.font = "italic bold 32px sans-serif";
        ctx.shadowColor = "rgba(255, 202, 40, 0.6)";
        ctx.shadowBlur = 10;
        ctx.fillText(`${combo} COMBO! ${isFever ? "🔥 FEVER 2x" : ""}`, 20, 80);
        ctx.restore();
      }

      // 準備時間の表示（最初のボールが出るまで）
      const prepRemain = PREP_TIME - travelTime - currentTime;
      if (prepRemain > 0) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.font = "bold 30px sans-serif";
        ctx.fillText("READY ?", canvas.width / 2 + 40, 175);
        ctx.fillStyle = "rgba(200,200,230,0.8)";
        ctx.font = "15px sans-serif";
        ctx.fillText(document.body.classList.contains("mobile") ? "左手: 画面の左側タップ　右手: 画面の右側タップ" : "左手: A / 上半分タップ　右手: L・J / 下半分タップ", canvas.width / 2 + 40, 205);
        if (prepRemain <= 3) {
          const frac = prepRemain - Math.floor(prepRemain);
          const sc = 1 + 0.5 * frac;
          ctx.translate(canvas.width / 2 + 40, 275);
          ctx.scale(sc, sc);
          ctx.globalAlpha = 0.35 + 0.65 * (1 - frac);
          ctx.fillStyle = "#ffca28";
          ctx.font = "bold 64px sans-serif";
          ctx.textBaseline = "middle";
          ctx.fillText(String(Math.ceil(prepRemain)), 0, 0);
        }
        ctx.restore();
      }

      drawBreakdownFront(currentTime);

      if (feedbackTimer > 0) {
        ctx.fillStyle = feedbackColor;
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feedback, canvas.width / 2, 75);
        feedbackTimer--;
      }

      ctx.restore();

      // 曲終了処理
      if (!bgm.ended) {
        requestAnimationFrame(gameLoop);
      } else {
        startFinish();
      }
    }

    // ===================== 結果画面（ランク・フルコンボ演出） =====================
    let perfectCount = 0, goodCount = 0, missCount = 0;
    let finishActive = false, finishStart = 0, finishLast = 0, finishRaf = 0;
    let finishInfo = null, finishFlags = {};
    let fx = [];   // 演出用パーティクル

    const RANK_STYLE = {
      SS: { c1: "#ffffff", c2: "#ffd54f", glow: "#ff4081", rays: "255,213,79", level: 5 },
      S:  { c1: "#fff59d", c2: "#ffca28", glow: "#ffca28", rays: "255,202,40", level: 4 },
      A:  { c1: "#ff80ab", c2: "#ff4081", glow: "#ff4081", rays: "255,64,129", level: 3 },
      B:  { c1: "#81d4fa", c2: "#29b6f6", glow: "#29b6f6", rays: "41,182,246", level: 2 },
      C:  { c1: "#cfd8dc", c2: "#90a4ae", glow: "#90a4ae", rays: "144,164,174", level: 1 }
    };
    const CONFETTI_COLORS = ["#ff4081", "#ffca28", "#29b6f6", "#00e676", "#ffffff", "#b388ff"];

    // 理論値: 全PERFECT・フルコンボ（10コンボ目からFEVER×2）
    function calcMaxScore(n) {
      let s = 0;
      for (let i = 1; i <= n; i++) s += (100 + Math.min(i * 10, 300)) * (i >= 10 ? 2 : 1);
      return s;
    }

    function playFanfare(kind, level) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const tone = (freq, start, dur, type, vol) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now + start);
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(vol, now + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + start); osc.stop(now + start + dur + 0.05);
      };
      if (kind === "rank") {
        const scale = [392, 523.25, 659.25, 783.99, 1046.5];            // G4 C5 E5 G5 C6
        const n = Math.max(1, level);
        for (let i = 0; i < n; i++) tone(scale[i], i * 0.09, 0.32, "triangle", 0.22);
        if (level >= 4) [523.25, 659.25, 783.99].forEach(f => tone(f, n * 0.09, 0.9, "sine", 0.14));
      } else if (kind === "fullcombo") {
        [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => tone(f, i * 0.07, 0.5, "sine", 0.16));
        [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, 0.38, 1.3, "triangle", 0.12));
      } else if (kind === "boom") {
        tone(180, 0, 0.18, "sine", 0.18); tone(90, 0, 0.25, "sine", 0.2);
      }
    }

    function spawnFirework(x, y, count, colors) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 90 + Math.random() * 270;
        fx.push({ kind: "spark", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 240,

                  color: colors[(Math.random() * colors.length) | 0] });

    }
    function spawnConfetti(n) {
      for (let i = 0; i < n; i++) {
        fx.push({ kind: "conf", x: Math.random() * canvas.width, y: -10, vx: (Math.random() - 0.5) * 40,
                  vy: 70 + Math.random() * 130, g: 0, life: 0, max: 6, size: 5 + Math.random() * 4,
                  rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 9, sway: Math.random() * 6.28,
                  color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0] });
      }
    }

    function startFinish() {
      isPlaying = false;
      const N = chartNotes.length;
      const caught = perfectCount + goodCount;
      const acc = N ? (perfectCount + goodCount * 0.5) / N : 0;
      const ratio = N ? Math.min(1, score / calcMaxScore(N)) : 0;
      const rv = 0.6 * acc + 0.4 * ratio;
      const fc = N > 0 && missCount === 0 && caught >= N;
      const ap = fc && goodCount === 0;
      let rank = rv >= 0.97 ? "SS" : rv >= 0.92 ? "S" : rv >= 0.80 ? "A" : rv >= 0.60 ? "B" : "C";
      if (rank === "SS" && !fc) rank = "S";      // SSはフルコンボ必須
      const prev = bestData[difficulty];
      const prevScore = prev ? prev.score : 0;
      const newRecord = score > prevScore;
      const nb = prev ? Object.assign({}, prev) : { score: 0, rank: "C", fc: false, ap: false };
      nb.score = Math.max(nb.score, score);
      if (RANK_ORDER.indexOf(rank) > RANK_ORDER.indexOf(nb.rank)) nb.rank = rank;
      nb.fc = nb.fc || fc; nb.ap = nb.ap || ap;
      const rec = { d: difficulty, t: Date.now(), score, rank, p: perfectCount, g: goodCount, m: missCount, mc: maxCombo, acc, fc, ap };
      if (newRecord || !prev || !prev.t) { nb.t = rec.t; nb.p = rec.p; nb.g = rec.g; nb.m = rec.m; nb.mc = rec.mc; nb.acc = rec.acc; }
      bestData[difficulty] = nb; saveBest(); renderBest();
      history.push(rec); saveHistory();
      finishInfo = { rank, fc, ap, acc, N, newRecord, prevScore, bestRank: nb.rank };
      finishFlags = {};
      fx = [];
      finishStart = performance.now();
      finishLast = finishStart;
      finishActive = true;
      syncMode();
      if (fc) canvas.classList.add("fever");

      cancelAnimationFrame(finishRaf);
      finishRaf = requestAnimationFrame(finishFrame);
    }

    function easeOut(x) { return 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3); }
    function easeOutBack(x) { x = Math.min(1, Math.max(0, x)); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }

    function drawFx(kind) {
      for (const p of fx) {
        if (p.kind !== kind) continue;
        if (kind === "spark") {
          const a = Math.max(0, 1 - p.life / p.max);
          ctx.globalAlpha = a; ctx.fillStyle = p.color;

    function stepFx(dt) {
      for (const p of fx) {

        else { p.sway += dt * 3; p.x += (p.vx + Math.sin(p.sway) * 30) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
      }
    }

    function finishFrame(now) {
      if (!finishActive) return;

      const dt = Math.min(0.05, (now - finishLast) / 1000);
      finishLast = now;
      const W = canvas.width, H = canvas.height;
      const info = finishInfo, st = RANK_STYLE[info.rank];

        ["MAX COMBO", String(maxCombo), "#ffea00", 20],
        ["PERFECT", String(perfectCount), "#ff4081", 20],
        ["GOOD", String(goodCount), "#00e676", 20],

        ctx.globalAlpha = a;
        ctx.translate((1 - a) * 30, 0);
        ctx.textAlign = "left"; ctx.fillStyle = "#a79dc0"; ctx.font = "bold 13px sans-serif";
        ctx.fillText(r[0], 318, y);
        ctx.textAlign = "right"; ctx.fillStyle = r[2]; ctx.font = `bold ${r[3]}px sans-serif`;
        ctx.fillText(r[1], 575, y + (r[3] > 20 ? 2 : 0));

        y += (i === 0 ? 40 : 32);
      });

        ctx.save();
        ctx.translate(155, 215);
        ctx.scale(sc, sc);
        ctx.globalAlpha = Math.min(1, k * 3);
        ctx.font = `italic 900 ${info.rank.length > 1 ? 118 : 150}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

        ctx.save();

        ctx.globalAlpha = Math.min(1, k * 3);
        ctx.font = "italic 900 44px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

    // ===================== 記録画面 =====================
    const DIFF_LABEL = { easy: "🌱 かんたん", normal: "🎵 ふつう", hard: "🔥 むずかしい" };
    let recDiff = "hard";
    const fmtDate = (t) => { try { return new Date(t).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
    function rankColor(r) { return (RANK_STYLE[r] || RANK_STYLE.C).c2; }
    function openRecords() {

    function setRecDiff(d) { recDiff = d; renderRecords(); }

      } else {

    // ===================== スマホ（横持ち）対応 =====================

    const isMobile = () => document.body.classList.contains("mobile");

    function syncMode() {

    function vpSize() { const v = window.visualViewport; return v ? { w: v.width, h: v.height, x: v.offsetLeft, y: v.offsetTop } : { w: innerWidth, h: innerHeight, x: 0, y: 0 }; }
    // 画面（ブラウザの表示部分を除いた見える範囲）いっぱいにゲーム画面を広げる。余った左右がタップ領域
    function fitStage() {

      stageEl.style.left = v.x + "px"; stageEl.style.top = v.y + "px";
      const cs = getComputedStyle(stageEl);

    // 画面のどこをタップしてもOK: 左半分=左手 / 右半分=右手（複数本指も1本ずつ判定）
    window.addEventListener("pointerdown", (e) => {
      if (!isMobile() || !isPlaying || pausedByRotate) return;
      e.preventDefault();
      const v = vpSize();
      const left = e.clientX < v.x + v.w / 2;
      catchBall(left ? "left" : "right");
      const r = document.createElement("div");
      r.className = "ripple"; r.style.left = e.clientX + "px"; r.style.top = e.clientY + "px";
      r.style.borderColor = left ? "rgba(129,212,250,.8)" : "rgba(255,138,128,.8)";
      document.body.appendChild(r); setTimeout(() => r.remove(), 400);
    }, { passive: false });

    // 全画面ボタン（対応しているブラウザのみ。iPhoneのSafariは非対応なので案内を出す）
    const fsEl = document.documentElement;
    const fsSupported = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
    const fsActive = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    if (isMobile() && !standalone) document.body.classList.add(fsSupported ? "fs-ok" : "fs-ng");
    function updateFsLabel() { const b = document.getElementById("fsBtn"); if (b) b.textContent = fsActive() ? "🗗 全画面を解除" : "⛶ 全画面にする"; }
    function toggleFullscreen() {
      try {
        if (fsActive()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
        const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
        const lock = () => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {}); } catch (e) {} };
        if (r && r.then) r.then(lock).catch(() => {}); else lock();
      } catch (e) {}
    }
    document.addEventListener("fullscreenchange", () => { updateFsLabel(); setTimeout(onViewportChange, 100); });
    document.addEventListener("webkitfullscreenchange", () => { updateFsLabel(); setTimeout(onViewportChange, 100); });
    syncMode(); onViewportChange();

    renderBest();
    drawTitleScreen();
  </script>
  <div id="recOverlay"><div id="recBox"></div></div>
</body>
</html>
